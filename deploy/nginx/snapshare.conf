# SnapShare — nginx site config (host nginx in front of docker-compose.prod.yml).
#
# Domains: snap.topitsolutions.co.nz (app) and snap-media.topitsolutions.co.nz (photos).
# Upstreams: backend 127.0.0.1:3030, storage 127.0.0.1:9030 (match BACKEND_PORT / S3_PORT in .env).
#
# 1. DNS A records for both domains → the VPS IP.
# 2. sudo cp snapshare.conf /etc/nginx/sites-available/ && sudo ln -s ../sites-available/snapshare.conf /etc/nginx/sites-enabled/
# 3. sudo nginx -t && sudo systemctl reload nginx
# 4. sudo certbot --nginx -d snap.topitsolutions.co.nz -d snap-media.topitsolutions.co.nz   (adds HTTPS + redirects)

# ─── App: API, WebSockets, dashboard, slideshow, join page ───────────────────
server {
    listen 80;
    listen [::]:80;
    server_name snap.topitsolutions.co.nz;

    # Photos go straight to storage, so API requests stay small.
    client_max_body_size 2m;

    location /ws {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;   # live feeds stay open for hours
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;      # used for rate limiting
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;        # stream ZIP downloads instead of buffering them
        proxy_read_timeout 600s;    # large ZIP exports
    }
}

# ─── Media: photo uploads (presigned PUT) and public thumbnails ──────────────
server {
    listen 80;
    listen [::]:80;
    server_name snap-media.topitsolutions.co.nz;

    client_max_body_size 25m;
    proxy_request_buffering off;    # pass uploads straight through

    location / {
        proxy_pass http://127.0.0.1:9030;
        proxy_http_version 1.1;
        # Upload URLs are signed for this exact host — it must reach storage unchanged.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;

        # Processed photos never change — let browsers and phones cache them.
        location ~ ^/[^/]+/public/ {
            proxy_pass http://127.0.0.1:9030;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
    }
}
